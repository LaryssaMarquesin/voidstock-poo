services:
  - type: web
    name: voidstock-poo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web_app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      # DATABASE_URL é configurada diretamente no serviço (banco Postgres
      # 'voidstock-db' provisionado no Render), não pelo Blueprint.
