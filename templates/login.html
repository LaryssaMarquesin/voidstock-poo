<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VoidStock — Entrar</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
    <div class="card" style="width:100%;max-width:400px;">
      <div style="text-align:center;margin-bottom:20px;">
        <img src="/static/voidstock-logo.png" alt="VoidStock" style="height:36px;">
        <p class="text-muted" style="font-size:13px;margin-top:10px;">Controle de estoque para equipes técnicas</p>
      </div>

      {% if erro %}<div class="note err" style="margin-bottom:16px;">{{ erro }}</div>{% endif %}

      <form method="post" action="/login" class="form-grid" style="max-width:none;">
        <div class="field">
          <label>E-mail</label>
          <input class="input" type="email" name="email" placeholder="voce@exemplo.com" required autofocus>
        </div>
        <div class="field">
          <label>Senha</label>
          <input class="input" type="password" name="senha" placeholder="••••••••" required>
        </div>
        <div><button class="btn" type="submit" style="width:100%;justify-content:center;">Entrar</button></div>
      </form>

      <div class="note info" style="margin-top:18px;font-size:12px;line-height:1.7;">
        <b>Contas de demonstração</b><br>
        Coordenador — <code>robson@pilhadigital.com.br</code> / <code>admin123</code><br>
        Usuário — <code>helen@artcont.com.br</code> / <code>user123</code>
      </div>
    </div>
  </div>
</body>
</html>
