name: keep-warm

# Mantém o app no Render acordado (o plano free dorme após ~15 min de inatividade).
# Faz um ping a cada 10 minutos. Repositório público => minutos de Actions ilimitados.

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 minutos (horário UTC)
  workflow_dispatch:          # permite rodar manualmente pelo botão "Run workflow"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Acordar o app
        run: |
          echo "Pingando o app..."
          code=$(curl -sS -m 90 -o /dev/null -w "%{http_code}" https://voidstock-poo.onrender.com/ || echo "000")
          echo "HTTP $code"
